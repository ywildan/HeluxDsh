name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

# One APK build at a time per branch; a newer push cancels the older run.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK ships preinstalled on ubuntu-latest runners.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Verify manifest declarations
        run: python3 scripts/check-manifest.py

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Proves the shipped APK itself declares every component and the
      # version we think it is - not just that the sources compile.
      - name: Verify contents of the built APK
        run: |
          set -euo pipefail
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.txt"

          # Surface the truth first: these notices are readable without log access.
          PERMS="$(grep -o 'android.permission.[A-Z_]*' "$RUNNER_TEMP/manifest.txt" | sort -u | tr '\n' ' ')"
          COMPONENTS="$(grep -o 'id.helux.dsh.[A-Za-z]*' "$RUNNER_TEMP/manifest.txt" | sort -u | tr '\n' ' ')"
          echo "::notice::APK permissions: ${PERMS:-none}"
          echo "::notice::APK components: ${COMPONENTS:-none}"
          echo "::notice::APK versionCode: $("$AAPT2" dump badging "$APK" | grep -o "versionCode='[0-9]*'")"

          MERGED="$(find app/build/intermediates -name AndroidManifest.xml -path '*merged*' | head -1)"
          if [ -n "$MERGED" ]; then
            echo "::notice::merged manifest: $MERGED"
            echo "::notice::merged permissions: $(grep -o 'android.permission.[A-Z_]*' "$MERGED" | sort -u | tr '\n' ' ')"
          fi

          for component in MainActivity ScanActivity; do
            if ! grep -q "id.helux.dsh.$component" "$RUNNER_TEMP/manifest.txt"; then
              echo "::error::$component is missing from the APK manifest"
              exit 1
            fi
          done
          echo "APK declares both activities"

          grep -q 'android.permission.CAMERA' "$RUNNER_TEMP/manifest.txt" \
            || { echo "::error::CAMERA permission missing from the APK"; exit 1; }
          grep -q 'android.permission.INTERNET' "$RUNNER_TEMP/manifest.txt" \
            || { echo "::error::INTERNET permission missing from the APK"; exit 1; }

          extra="$(printf '%s' "$PERMS" | tr ' ' '\n' | grep -v -E '^(CAMERA|INTERNET)?$' | grep -v -E '^(CAMERA|INTERNET)$' || true)"
          if [ -n "$extra" ]; then
            echo "::error::unexpected permissions in the APK: $(echo "$extra" | tr '\n' ' ')"
            exit 1
          fi
          echo "APK permissions are exactly CAMERA + INTERNET"

      - name: Report APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | size | sha256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| app-debug.apk | $(du -h "$APK" | cut -f1) | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helux-dsh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
