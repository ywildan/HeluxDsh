name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

# One APK build at a time per branch; a newer push cancels the older run.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK ships preinstalled on ubuntu-latest runners.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Verify manifest declarations
        run: python3 scripts/check-manifest.py

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Proves the shipped APK itself declares every component and the version
      # we think it is - compiling is not proof. Note that `dump xmltree` shows
      # every occurrence of "android.permission.*", including the
      # android:permission attribute on library receivers; only
      # `dump permissions` lists what the app actually requests.
      - name: Verify contents of the built APK
        run: |
          set -euo pipefail
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          APK=app/build/outputs/apk/debug/app-debug.apk

          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.txt"
          "$AAPT2" dump permissions "$APK" > "$RUNNER_TEMP/permissions.txt"

          COMPONENTS="$(grep -o 'id\.helux\.dsh\.[A-Za-z]*' "$RUNNER_TEMP/manifest.txt" | sort -u | tr '\n' ' ')"
          REQUESTED="$(sed -n "s/^uses-permission: name='\(.*\)'/\1/p" "$RUNNER_TEMP/permissions.txt" | sort -u)"
          VERSION="$(grep -o "versionCode='[0-9]*'" <<< "$("$AAPT2" dump badging "$APK")")"

          echo "::notice::APK components: ${COMPONENTS:-none}"
          echo "::notice::APK requested permissions: $(echo "$REQUESTED" | tr '\n' ' ')"
          echo "::notice::APK versionCode: ${VERSION}"

          for component in MainActivity ScanActivity; do
            grep -q "id.helux.dsh.$component" "$RUNNER_TEMP/manifest.txt" \
              || { echo "::error::$component is missing from the APK manifest"; exit 1; }
          done
          echo "APK declares MainActivity and ScanActivity"

          # AGP injects <applicationId>.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION
          # for every app targeting SDK 33+, so dynamically registered receivers
          # default to NOT_EXPORTED. It is a signature-level permission the
          # system grants automatically and users never see it. Everything else
          # must be exactly CAMERA + INTERNET.
          ALLOWED_EXTRA="id.helux.dsh.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          unexpected="$(echo "$REQUESTED" | grep -v -x -F -e 'android.permission.CAMERA' \
            -e 'android.permission.INTERNET' -e "$ALLOWED_EXTRA" || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected permissions in the APK: $(echo "$unexpected" | tr '\n' ' ')"
            exit 1
          fi
          for required in android.permission.CAMERA android.permission.INTERNET; do
            echo "$REQUESTED" | grep -q -x -F "$required" \
              || { echo "::error::$required is missing from the APK"; exit 1; }
          done
          echo "APK requests CAMERA + INTERNET and nothing user-visible beyond that"

          if ! grep -q "android:name=\"id.helux.dsh.ScanActivity\"" "$RUNNER_TEMP/manifest.txt" \
             && ! grep -q "id.helux.dsh.ScanActivity\"" "$RUNNER_TEMP/manifest.txt"; then
            echo "::error::ScanActivity is present but not as a declared activity"
            exit 1
          fi

          [ "$VERSION" = "versionCode='2'" ] \
            || { echo "::error::unexpected versionCode: $VERSION"; exit 1; }
          echo "APK versionCode is 2"

      - name: Report APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          echo "### APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | size | sha256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| app-debug.apk | $(du -h "$APK" | cut -f1) | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: helux-dsh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
