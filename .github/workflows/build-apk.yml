name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "scripts/**"
      - "*.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

# One APK build at a time per branch; a newer push cancels the older run.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble debug + release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # Kept in one place: both APKs are verified against these values, so a
      # version bump that misses one file fails the build instead of shipping.
      EXPECTED_VERSION_CODE: "5"
      EXPECTED_VERSION_NAME: "1.1.1"

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android SDK ships preinstalled on ubuntu-latest runners.
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Optional: a real release key. Without the secret the Gradle script signs
      # the release APK with the debug key, so the build still produces an
      # installable file rather than failing or emitting an unsigned APK.
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HELUX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HELUX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HELUX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HELUX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice::no HELUX_KEYSTORE_BASE64 secret; the release APK will be debug-signed"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/helux-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          {
            echo "HELUX_KEYSTORE_FILE=$KEYSTORE"
            echo "HELUX_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "HELUX_KEY_ALIAS=$KEY_ALIAS"
            echo "HELUX_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::notice::release APK will be signed with the configured keystore"

      - name: Verify manifest declarations
        run: python3 scripts/check-manifest.py

      # Robolectric instantiates the real Activities here, which is what catches
      # a launch-time crash (inflate failure, missing view id, type mismatch)
      # before a phone ever sees it.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # Compiling is not proof. These check the shipped files themselves.
      - name: Verify debug APK
        run: ./scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Verify release APK
        run: ./scripts/verify-apk.sh app/build/outputs/apk/release/app-release.apk

      - name: Report APKs
        run: |
          set -euo pipefail
          echo "### APKs built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| file | size | sha256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -f "$apk"
            echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) | \`$(sha256sum "$apk" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: helux-dsh-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: helux-dsh-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
